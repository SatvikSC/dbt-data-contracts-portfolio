name: dbt CI / CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same branch on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DBT_PROFILES_DIR: "."
  DBT_DUCKDB_PATH: "/tmp/ci_dev.duckdb"

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — CI gate (runs on every PR and push to main)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  dbt-ci:
    name: dbt CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt + dependencies
        run: pip install dbt-duckdb==1.11.0 pip-system-certs

      # profiles.yml is gitignored — write it here for CI using DuckDB
      - name: Write CI profiles.yml
        run: |
          cat > profiles.yml << 'EOF'
          ecommerce_dbt:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: "/tmp/ci_dev.duckdb"
                schema: dev
                threads: 4
          EOF

      # Populate raw schema with synthetic data — no external dependencies
      - name: Set up CI source database
        run: python scripts/setup_ci_db.py --db-path /tmp/ci_dev.duckdb

      - name: dbt deps
        run: dbt deps

      - name: dbt compile (syntax check)
        run: dbt compile

      # ── Source contract tests — PR is blocked if contracts are violated ──
      - name: Source contract tests
        run: dbt test --select source:*

      # ── Slim CI: download manifest from last main-branch run ─────────────
      - name: Download production manifest
        uses: actions/download-artifact@v4
        with:
          name: dbt-prod-manifest
          path: prod-manifest/
        continue-on-error: true   # First run — no manifest exists yet

      # ── Run only changed models (+ downstream) when manifest is available ─
      - name: dbt snapshot + seed
        run: |
          dbt snapshot
          dbt seed

      - name: dbt run
        run: |
          if [ -f prod-manifest/manifest.json ]; then
            echo "Slim CI: running modified+ models only"
            dbt run --select state:modified+ --state prod-manifest/
          else
            echo "No manifest found — running full pipeline"
            dbt run
          fi

      - name: dbt test
        run: |
          if [ -f prod-manifest/manifest.json ]; then
            dbt test --select state:modified+ --state prod-manifest/
          else
            dbt test
          fi

      # ── Store manifest so next run can use slim CI ────────────────────────
      - name: Upload manifest artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dbt-prod-manifest
          path: target/manifest.json
          retention-days: 30

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — Deploy dbt docs to GitHub Pages (merge to main only)
# Setup required in repo: Settings → Pages → Source: GitHub Actions
# ─────────────────────────────────────────────────────────────────────────────
  deploy-docs:
    name: Deploy dbt Docs
    needs: dbt-ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt + dependencies
        run: pip install dbt-duckdb==1.11.0 pip-system-certs

      - name: Write CI profiles.yml
        run: |
          cat > profiles.yml << 'EOF'
          ecommerce_dbt:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: "/tmp/docs_dev.duckdb"
                schema: dev
                threads: 4
          EOF

      - name: Set up source database
        run: python scripts/setup_ci_db.py --db-path /tmp/docs_dev.duckdb

      - name: dbt deps
        run: dbt deps

      - name: dbt snapshot + seed + run
        run: |
          dbt snapshot
          dbt seed
          dbt run

      - name: Generate dbt docs
        run: dbt docs generate

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
